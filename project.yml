# Source of the Xcode project: after changing it, run `xcodegen` to regenerate Ghisa.xcodeproj.
name: Ghisa
options:
  bundleIdPrefix: com.simone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Client for the online database (login, tables, photos): https://github.com/supabase/supabase-swift
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Ghisa:
    type: application
    platform: iOS
    sources:
      - Ghisa
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Ghisa/Info.plist
      properties:
        # The working copy of the Excel file is visible in Files › On my iPhone › Ghisa.
        UIFileSharingEnabled: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Online database, filled in from Config/Secrets.xcconfig at build time.
        SupabaseProject: $(SUPABASE_PROJECT)
        SupabaseKey: $(SUPABASE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simone.ghisa
        PRODUCT_NAME: Ghisa
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ghisa
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "Per fotografare i macchinari della palestra."
        ENABLE_PREVIEWS: YES
